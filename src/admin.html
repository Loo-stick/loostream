<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LooStream - Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 1.8em; }
        .header .meta { color: #a0a0b0; font-size: 0.9em; }
        .btn {
            background: #7f5af0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .btn:hover { background: #6b46e0; }
        .btn.secondary { background: rgba(255,255,255,0.1); }
        .btn.secondary:hover { background: rgba(255,255,255,0.15); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            font-size: 1em;
            margin-bottom: 12px;
            color: #a0a0b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .scraper-card {
            border-left: 4px solid #888;
            position: relative;
        }
        .scraper-card.status-ok { border-left-color: #4ade80; }
        .scraper-card.status-warning { border-left-color: #facc15; }
        .scraper-card.status-down { border-left-color: #f87171; }
        .scraper-card .name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scraper-card .reason {
            color: #facc15;
            font-size: 0.85em;
            margin-bottom: 10px;
        }
        .bars {
            display: flex;
            gap: 3px;
            margin: 10px 0;
            height: 6px;
        }
        .bars > div { flex: 1; border-radius: 2px; }
        .bar-s { background: #4ade80; }
        .bar-e { background: #facc15; }
        .bar-x { background: #f87171; }
        .stats-row {
            display: flex;
            justify-content: space-between;
            color: #a0a0b0;
            font-size: 0.85em;
            margin-top: 8px;
        }
        .stats-row strong { color: #fff; }

        .kv { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 0.9em; }
        .kv .k { color: #a0a0b0; }
        .kv .v { font-weight: 600; color: #fff; }

        .health-box, .sources-box, .whitelist-box { margin-top: 20px; }
        .health-source {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .health-source.up { border-left: 3px solid #4ade80; }
        .health-source.down { border-left: 3px solid #f87171; }
        .health-source.degraded { border-left: 3px solid #facc15; }
        .loader { color: #a0a0b0; font-size: 0.9em; font-style: italic; }
        .error { color: #f87171; font-size: 0.9em; }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>⚙️ LooStream Admin</h1>
            <div class="meta" id="meta">Chargement...</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn secondary" onclick="checkHealth()">Health check</button>
            <button class="btn" onclick="refreshAll()">Refresh</button>
            <form action="/admin/logout" method="post" style="display: inline;">
                <button type="submit" class="btn secondary">Déconnexion</button>
            </form>
        </div>
    </div>

    <h2 style="margin-bottom: 12px; font-size: 1.1em; color: #a0a0b0;">Scrapers</h2>
    <div class="grid" id="scrapers"><div class="loader">Chargement...</div></div>

    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
        <div class="card">
            <h2>Cache</h2>
            <div class="kv" id="cache"></div>
        </div>
        <div class="card">
            <h2>Requêtes</h2>
            <div class="kv" id="requests"></div>
        </div>
        <div class="card">
            <h2>Streams servis</h2>
            <div class="kv" id="served"></div>
        </div>
    </div>

    <div class="card health-box">
        <h2>Live health check</h2>
        <div id="health"><div class="loader">Clique "Health check" pour lancer une sonde</div></div>
    </div>

    <div class="card sources-box">
        <h2>URLs des sources <span style="font-size:0.7em;color:#a0a0b0;font-weight:normal;">— édition à chaud, sans rebuild</span></h2>
        <div id="endpoints"><div class="loader">Chargement...</div></div>
    </div>

    <div class="card whitelist-box">
        <h2>Whitelist des domaines</h2>
        <div id="whitelist"><div class="loader">Chargement...</div></div>
    </div>
</div>

<style>
    .cfg-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .cfg-row label { min-width:100px; color:#a0a0b0; font-size:0.9em; }
    .cfg-row input { flex:1; min-width:180px; padding:8px 10px; border:1px solid rgba(255,255,255,0.15);
        border-radius:8px; background:rgba(0,0,0,0.25); color:#fff; font-size:0.9em; }
    .cfg-save { padding:8px 14px; }
    .cfg-msg { font-size:0.82em; margin-left:6px; }
    .cfg-msg.ok { color:#4ade80; } .cfg-msg.err { color:#f87171; }
    .badge { font-size:0.72em; padding:3px 9px; border-radius:20px; }
    .badge.on { background:rgba(74,222,128,0.2); color:#4ade80; }
    .badge.off { background:rgba(160,160,176,0.2); color:#a0a0b0; }
</style>

<script>
const fmtPct = n => (n * 100).toFixed(0) + '%';
const fmtAge = ts => {
    if (!ts) return 'jamais';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'min';
    if (s < 86400) return Math.floor(s / 3600) + 'h';
    return Math.floor(s / 86400) + 'j';
};
const fmtBytes = b => {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
};
const EMOJI = { ok: '🟢', warning: '🟡', down: '🔴' };

function buildScraperCard(name, m) {
    const bars = [];
    const pad = 20 - m.window;
    for (let i = 0; i < pad; i++) bars.push('<div style="background:rgba(255,255,255,0.05)"></div>');
    for (let i = 0; i < m.success; i++) bars.push('<div class="bar-s"></div>');
    for (let i = 0; i < m.empty; i++) bars.push('<div class="bar-e"></div>');
    for (let i = 0; i < m.errors; i++) bars.push('<div class="bar-x"></div>');

    return `
        <div class="card scraper-card status-${m.status}">
            <div class="name">${EMOJI[m.status]} ${name}</div>
            ${m.statusReason ? `<div class="reason">${m.statusReason}</div>` : ''}
            <div class="bars">${bars.join('')}</div>
            <div class="stats-row">
                <span>Fenêtre <strong>${m.window}/20</strong></span>
                <span>Empty <strong>${fmtPct(m.emptyRate)}</strong></span>
                <span>Erreurs <strong>${fmtPct(m.errorRate)}</strong></span>
            </div>
            <div class="stats-row">
                <span>Dernier succès</span>
                <span><strong>${fmtAge(m.lastSuccessAt)}</strong></span>
            </div>
            ${m.lastError ? `<div class="stats-row"><span>Dernière erreur</span><span><strong title="${m.lastError}">${m.lastError.substring(0, 30)}...</strong></span></div>` : ''}
        </div>
    `;
}

async function loadStats() {
    try {
        const r = await fetch('/api/stats');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const s = await r.json();

        document.getElementById('meta').textContent =
            `Uptime ${s.uptime} · Dernière MAJ ${new Date().toLocaleTimeString('fr-FR')}`;

        document.getElementById('scrapers').innerHTML = Object.entries(s.metrics)
            .map(([name, m]) => buildScraperCard(name, m)).join('');

        const c = s.cache;
        document.getElementById('cache').innerHTML = `
            <span class="k">Hit rate</span><span class="v">${fmtPct(c.hitRate)}</span>
            <span class="k">Hits / Misses</span><span class="v">${c.hits} / ${c.misses}</span>
            <span class="k">Entrées actives</span><span class="v">${c.liveEntries}</span>
            <span class="k">Taille DB</span><span class="v">${fmtBytes(c.fileSizeBytes)}</span>
            ${Object.entries(c.byScope).map(([sc, n]) => `<span class="k">└ ${sc}</span><span class="v">${n}</span>`).join('')}
        `;

        document.getElementById('requests').innerHTML = `
            <span class="k">Total</span><span class="v">${s.requests.total}</span>
            <span class="k">Streams</span><span class="v">${s.requests.streams}</span>
            <span class="k">Proxy</span><span class="v">${s.requests.proxy}</span>
        `;

        document.getElementById('served').innerHTML = Object.entries(s.streamsServed)
            .map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');
    } catch (e) {
        document.getElementById('meta').innerHTML = `<span class="error">Erreur: ${e.message}</span>`;
    }
}

async function checkHealth() {
    const box = document.getElementById('health');
    box.innerHTML = '<div class="loader">Vérification en cours...</div>';
    try {
        const r = await fetch('/api/health');
        const h = await r.json();
        box.innerHTML = Object.entries(h.sources).map(([src, d]) => `
            <div class="health-source ${d.status}">
                <span><strong>${src}</strong></span>
                <span>${d.status.toUpperCase()} · ${d.latency ? d.latency + 'ms' : ''} ${d.error ? '— ' + d.error : ''}</span>
            </div>
        `).join('');
    } catch (e) {
        box.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
}

function refreshAll() {
    loadStats();
    loadEndpoints();
    loadWhitelist();
}

// --- URLs des sources (édition à chaud) ---
// Movix a 3 champs (api/referer/origin) ; les autres une seule base.
const SOURCES = [
    { path: 'movix', label: 'Movix', fields: ['api', 'referer', 'origin'], note: 'pilote aussi Wiflix, VoirDrama (API) et FrenchStream (API)' },
    { path: 'frenchstream', label: 'FrenchStream', fields: ['base'] },
    { path: 'streamflix', label: 'StreamFlix', fields: ['base'] },
    { path: 'voirdrama', label: 'VoirDrama', fields: ['base'], note: 'scraping du site ; les dramas passent par Movix' },
    { path: 'voiranime', label: 'VoirAnime', fields: ['base'], note: 'scraping du site (anime, gaté sur les titres japonais)' },
    { path: 'nabistream', label: 'Nabistream', fields: ['base'], note: 'API dramas asiatiques VOSTFR (keyée TMDB, HLS direct + subs FR)' },
    { path: 'coflix', label: 'Coflix', fields: ['base'], note: 'scraping FR généraliste VF+VOSTFR (domaine tournant, fallbacks intégrés)' },
];

async function loadEndpoints() {
    const box = document.getElementById('endpoints');
    try {
        const data = await Promise.all(SOURCES.map(async s => {
            const r = await fetch('/api/' + s.path + '/endpoints');
            return { s, v: await r.json() };
        }));
        box.innerHTML = data.map(({ s, v }) => {
            // Un label par champ (essentiel pour Movix : api / referer / origin).
            const rows = s.fields.map(f => `
                <div class="cfg-row">
                    <label>${f}</label>
                    <input id="ep-${s.path}-${f}" placeholder="${f}" value="${(v[f] || '').replace(/"/g, '&quot;')}">
                </div>`).join('');
            return `<div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06);">
                <div style="font-weight:600;margin-bottom:8px;">${s.label}</div>
                ${rows}
                <div class="cfg-row" style="margin-left:108px;">
                    <button class="btn cfg-save" onclick="saveEndpoint('${s.path}')">Enregistrer</button>
                    <span class="cfg-msg" id="msg-${s.path}"></span>
                </div>
                ${s.note ? `<div style="font-size:0.78em;color:#7a7a8a;margin-left:108px;">${s.note}</div>` : ''}
            </div>`;
        }).join('');
    } catch (e) {
        box.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
}

async function saveEndpoint(path) {
    const src = SOURCES.find(s => s.path === path);
    const msg = document.getElementById('msg-' + path);
    const body = {};
    for (const f of src.fields) body[f] = document.getElementById('ep-' + path + '-' + f).value.trim();
    msg.textContent = '…'; msg.className = 'cfg-msg';
    try {
        const r = await fetch('/api/' + path + '/endpoints', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const j = await r.json();
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        msg.textContent = '✓ appliqué'; msg.className = 'cfg-msg ok';
    } catch (e) {
        msg.textContent = '✗ ' + e.message; msg.className = 'cfg-msg err';
    }
}

// --- Whitelist ---
async function loadWhitelist() {
    const box = document.getElementById('whitelist');
    try {
        const r = await fetch('/api/whitelist');
        const w = await r.json();
        const badge = w.autoWhitelist
            ? '<span class="badge on">AUTO_WHITELIST activé</span>'
            : '<span class="badge off">AUTO_WHITELIST désactivé</span>';
        box.innerHTML = `
            <div style="margin-bottom:10px;">${badge}
                <span style="color:#a0a0b0;font-size:0.85em;margin-left:8px;">${w.domains.length} domaines autorisés</span>
            </div>
            <div class="cfg-row">
                <input id="wl-domain" placeholder="exemple.com (couvre les sous-domaines)">
                <button class="btn cfg-save" onclick="addDomain()">Ajouter</button>
                <span class="cfg-msg" id="msg-wl"></span>
            </div>
            <details style="margin-top:8px;"><summary style="cursor:pointer;color:#a0a0b0;font-size:0.85em;">Voir la liste</summary>
                <div style="font-size:0.8em;color:#7a7a8a;margin-top:6px;word-break:break-all;">${w.domains.join(' · ')}</div>
            </details>`;
    } catch (e) {
        box.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
}

async function addDomain() {
    const msg = document.getElementById('msg-wl');
    const domain = document.getElementById('wl-domain').value.trim();
    msg.textContent = '…'; msg.className = 'cfg-msg';
    try {
        const r = await fetch('/api/whitelist', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domain }),
        });
        const j = await r.json();
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        msg.textContent = j.added ? '✓ ajouté' : '✓ déjà présent'; msg.className = 'cfg-msg ok';
        loadWhitelist();
    } catch (e) {
        msg.textContent = '✗ ' + e.message; msg.className = 'cfg-msg err';
    }
}

loadStats();
loadEndpoints();
loadWhitelist();
setInterval(loadStats, 30000);
</script>
</body>
</html>
