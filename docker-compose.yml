services:
  loostream:
    # Image pré-construite (GHCR) : `docker compose up -d` la PULL, aucun build.
    # `docker compose up -d --build` rebuild depuis les sources à la place.
    image: ghcr.io/loo-stick/loostream:latest
    build: .
    container_name: loostream
    restart: unless-stopped
    # Garde-fou RAM (2026-08-10, apres le crash par thrashing) : pic mesure 119 Mio.
    # memswap_limit == mem_limit -> AUCUN swap ; au plafond : OOM-kill + restart.
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "${PORT:-7002}:${PORT:-7002}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Sidecar JA3 (curl_cffi) : le proxy délègue le fetch des URLs vidzy.cc ici
      # pour défaire leur fingerprinting TLS. Réseau Docker interne.
      - JA3_URL=http://loostream-ja3:8899
      - JA3_TOKEN=${JA3_TOKEN}
    volumes:
      - ./config:/app/config
    depends_on:
      - ja3
    healthcheck:
      # /api/stats : léger, en mémoire, NON gaté par ACCESS_KEY (contrairement à
      # /manifest.json qui renvoie 401 quand une clé d'accès est active).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7002/api/stats',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Sidecar JA3 (curl_cffi / impersonate Chrome). vidzy.cc fingerprinte le TLS :
  # tout client non-navigateur (axios, httpx, MediaFlow, okhttp de Nuvio) reçoit un
  # LEURRE bouclé. Ce service relaie les fetch vidzy.cc avec l'empreinte Chrome et
  # rien d'autre. Aucun port publié : joignable uniquement par loostream sur le
  # réseau Docker interne. Voir ja3/server.py.
  ja3:
    build: ./ja3
    image: ghcr.io/loo-stick/loostream-ja3:latest
    container_name: loostream-ja3
    restart: unless-stopped
    # curl_cffi + un petit serveur stdlib : empreinte RAM basse. Plafond + aucun swap.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      - JA3_TOKEN=${JA3_TOKEN}
      - JA3_PORT=8899
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8899/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MediaFlow (proxy d'extraction/lecture) — optionnel mais RECOMMANDÉ.
  # Sans lui, seuls les extracteurs locaux marchent (couverture réduite).
  # Lancer avec: docker compose --profile mediaflow up -d
  #
  # IMPORTANT — MediaFlow construit ses URLs de lecture depuis le host de la
  # requête (pas de var d'URL publique). Pour que les flux SE LISENT sur le
  # client (téléphone/PC distant), l'addon doit l'appeler par son URL PUBLIQUE :
  #   1) reverse-proxy: mediaflow.votredomaine -> http://127.0.0.1:${MEDIAFLOW_PORT:-8888}
  #   2) .env: MEDIAFLOW_URL=https://mediaflow.votredomaine (+ MEDIAFLOW_PASSWORD)
  # (En test 100% local, MEDIAFLOW_URL=http://127.0.0.1:8888 suffit si le client
  #  est sur la même machine.)
  mediaflow:
    image: ghcr.io/mhdzumair/mediaflow-proxy-light:latest
    container_name: loostream-mediaflow
    restart: unless-stopped
    # Garde-fou RAM (2026-08-10). A l'arret ici, mais dimensionne sur le mediaflow-light
    # de prod qui plafonne a ~21 Mio. memswap_limit == mem_limit -> AUCUN swap.
    mem_limit: 512m
    memswap_limit: 512m
    profiles:
      - mediaflow
    environment:
      APP__SERVER__HOST: 0.0.0.0
      APP__SERVER__PORT: "8888"
      APP__AUTH__API_PASSWORD: ${MEDIAFLOW_PASSWORD}
    ports:
      - "${MEDIAFLOW_PORT:-8888}:8888"

  # Bot Telegram (optionnel)
  # Lancer avec: docker compose --profile telegram up -d
  # Ou: COMPOSE_PROFILES=telegram docker compose up -d
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: loostream-telegram
    restart: unless-stopped
    # Garde-fou RAM (2026-08-10, apres le crash par thrashing) : pic mesure 60 Mio.
    # memswap_limit == mem_limit -> AUCUN swap ; au plafond : OOM-kill + restart.
    mem_limit: 512m
    memswap_limit: 512m
    profiles:
      - telegram
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DOMAINS_CONFIG=/app/config/allowed-domains.json
      - LOOSTREAM_CONTAINER=loostream
      # Jeton Matrix (annonces de domaine Movix) : se règle dans l'admin ; cette variable n'est qu'un repli
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loostream
